hero:
  eyebrow: CLOUD EXIT · OPEN STANDARDS · PUBLIC EVIDENCE
  title_lines:
    - Cloud exit is a capability,
    - not an event.
  title_size: 4.35rem
  align: center
  lead: >-
    If your data can't leave, your workloads are locked, and costs can't be audited, cloud was never a choice—it was a trap.
    Measure your actual exit capability with reproducible criteria, raw cost ledgers, and recovery drills.
  note: Draft Standard · Dated Price Snapshots · Disclosed Conflicts
  note_icon: fa-solid fa-shield-halved
  actions:
    - { label: Read the Criteria, url: standard/, icon: fa-solid fa-scale-balanced, style: primary }
    - { label: Check the Registry, url: standard/registry/, icon: fa-solid fa-list-check, style: ghost }

capabilities:
  eyebrow: Decision Chain
  title: Five practical questions every team must answer
  text: Cut through marketing rhetoric. Audit real exit tolls, verified hardware costs, public outages, and hands-on drills.
  items:
    - ref: 01 / STANDARD
      title: 'Unmasking Lock-in: How Cloud Vendors Trap You'
      url: standard/
      motto: Audit actual billing and architecture, not marketing claims
      bullets:
        - 'Prohibitive egress fees, proprietary runtime APIs, dark-pattern export traps, and multi-year contract lock.'
        - '5 reproducible criteria (C1–C5) covering network egress, whole data export, open protocols, and downtime liability.'
        - 'Full raw evidence and review dates published openly—any engineering team can test their own stack.'
      value: Replace corporate marketing with verifiable technical criteria that can be checked with cURL and simple scripts.
      visual:
        type: card
        icon: fa-solid fa-scale-balanced
        title: C1–C5 Core Criteria
        lines: [No Exit Tolls, Full Data Export, Open API Standards, No Lock-in Contracts, Transparent Downtime]

    - ref: 02 / LEDGER
      title: 'True Hardware Costs: How Much Cloud Rent Are You Paying?'
      url: ledger/
      motto: Pricing is pure arithmetic—run the spreadsheets yourself
      bullets:
        - 'At 200 GiB, 11.8K IOPS and 220 MiB/s, snapshot gp3 pricing is 2.16× AutoPL pricing; see the block-storage ledger.'
        - 'The baseline material-cost model crosses Alibaba c8i PAYG at 24 vCPU; utilization, topology and purchase term change the result.'
        - 'Open pricing snapshots, reproducible SQL pipelines, and open CSV ledgers with SHA-256 checksums.'
      value: 'Every dollar accounted for: identify exactly where managed service markups turn into pure unearned rent.'
      visual:
        type: code
        title: ledger.snapshot
        lines:
          - { class: c, prefix: '# ', text: '2026-08-22 Public Price Snapshot' }
          - { class: p, prefix: 'EBS/ESSD ', text: 'Baseline 0.54× → Parity 2.16×' }
          - { class: p, prefix: 'S3/OSS   ', text: '¥0.156 / ¥0.120 per GB-Mo' }
          - { class: ok, prefix: '✓ ', text: 'SQL Pipeline + CSV + SHA-256' }

    - ref: 03 / EVIDENCE
      title: 'Documented Failures: Concentration Risk in the Real World'
      url: evidence/
      motto: Outage risk is not theoretical—it happens on public record every quarter
      bullets:
        - 'The outage collection defines fields for duration, impact, sources and SLA remedies; incident records are not yet published.'
        - 'Proprietary lock-in catalog: mapping custom data formats, message brokers, and IAM traps.'
        - 'Press audit: juxtaposing vendor PR assurances directly against observable production outage reports.'
      value: 'Learn from historical reality: use documented incidents to evaluate the true limits of "five-nines" promises.'
      visual:
        type: components
        items:
          - { icon: fa-solid fa-triangle-exclamation, title: Outage Log, detail: Timestamped records }
          - { icon: fa-solid fa-link, title: Lock-in Map, detail: Categorized mechanisms }
          - { icon: fa-solid fa-quote-right, title: PR vs Reality, detail: Claims vs evidence }
          - { icon: fa-solid fa-clock-rotate-left, title: Audit History, detail: Revision history }

    - ref: 04 / CASES
      title: 'Field Case Studies: Who Succeeded, Who Stumbled, Who Went Back'
      url: cases/
      motto: No uncritical hype, no hidden pitfalls—raw engineering retrospectives
      bullets:
        - '37signals, Tantan and Ahrefs are calibration candidates; completed case assessments are not yet published.'
        - 'Partial, abandoned and reversed migrations will use the same evidence requirements as successful exits.'
        - 'Unified 6-question framework: what moved, what stayed, total expenses, time to break even, and lessons learned.'
      value: 'Avoid survivorship bias: understand why pioneers succeeded, and know when staying on cloud is the wiser choice.'
      visual:
        type: card
        icon: fa-solid fa-route
        title: 6-Question Framework
        lines: [What Moved, What Stayed, Financial Cost, Timeline, Failure Points, If Doing It Again]

    - ref: 05 / PLAYBOOK
      title: 'Monday Morning Drill: Testing Your Escape Hatch in an Afternoon'
      url: playbook/
      motto: Exit capability is not a reckless leap—it is a parachute you test regularly
      bullets:
        - 'Do not touch production app code first: spin up a spare machine and restore your core database.'
        - 'Time the recovery and log missing dependencies: identify proprietary services that break immediately.'
        - 'Turn recovery into a quarterly routine: the measured restore time is your actual exit capability.'
      value: 'Start with a bounded recovery exercise; record what finishes and what remains unresolved within the time available.'
      visual:
        type: code
        title: exit-drill.example
        lines:
          - { class: p, prefix: '# ', text: 'Example checklist, not a measured run' }
          - { class: ok, prefix: '1. ', text: 'Restore and verify a chosen dataset' }
          - { class: ok, prefix: '2. ', text: 'Record missing dependencies' }
          - { class: p, prefix: '3. ', text: 'Measure elapsed time and remaining work' }

criteria:
  eyebrow: Five Criteria
  title: An open standard any engineer can independently verify
  text: 'Every criterion follows the same engineering structure: clear definition → verification command → real calculations → edge cases.'
  columns: 3
  link_label: View Criteria
  items:
    - { title: 'C1 · No Exit Tolls', meta: Economics, icon: fa-solid fa-arrow-right-from-bracket, desc: 'Leaving should never incur punitive bandwidth egress tolls or data extraction ransom.', url: standard/c1-no-exit-toll/ }
    - { title: 'C2 · Whole Data Export', meta: Data, icon: fa-solid fa-box-archive, desc: 'Teams must be able to export complete data in standard formats within bounded time.', url: standard/c2-whole-data-export/ }
    - { title: 'C3 · Open Standards', meta: Portability, icon: fa-solid fa-plug, desc: 'Test whether required operations and semantics work through documented, independently implementable interfaces.', url: standard/c3-standard-interfaces/ }
    - { title: 'C4 · No Commitment Lock', meta: Contract, icon: fa-solid fa-file-signature, desc: 'Volume discounts must not become legal prison terms with punitive early exit penalties.', url: standard/c4-no-commitment-lock/ }
    - { title: 'C5 · Accountable Downtime', meta: Reliability, icon: fa-solid fa-clock-rotate-left, desc: 'Outages, root-cause analyses, and financial SLA penalties must be auditable.', url: standard/c5-accountable-downtime/ }
    - { title: 'Compliance Registry', meta: Results, icon: fa-solid fa-list-check, desc: 'No ratings published yet. The registry defines evidence, review dates, expiry, and appeals.', url: standard/registry/ }

scope:
  eyebrow: Scope
  title: Judged by technical behavior, not company branding
  text: Selling compute is an honest trade; engineering artificial lock-in to charge toll fees is the real danger.
  layout: grid
  columns: 2
  items:
    - title: In Scope
      icon: fa-solid fa-crosshairs
      desc: Punitive egress fees, proprietary export barriers, private APIs, predatory lock-in contracts, and unaccountable downtime.
      url: standard/scope/
    - title: Potential Allies
      icon: fa-solid fa-handshake
      desc: Infrastructure, CDNs, colocation facilities, and open cloud providers committed to open protocols and transparent pricing.
      url: standard/scope/

actions:
  eyebrow: Action Plan
  title: Pick a starting point to assess your actual position
  text: Stop debating hypotheticals. Take one small, concrete step to verify your infrastructure sovereignty today.
  columns: 3
  link_label: Start Here
  items:
    - { title: 'Audit Vendor Lock-in', meta: '5 Minutes', icon: fa-solid fa-magnifying-glass, desc: 'Run C1–C5 baseline checks against your current cloud architecture to list proprietary blockers.', url: standard/registry/ }
    - { title: 'Calculate True Costs', meta: '30 Minutes', icon: fa-solid fa-calculator, desc: 'Plug your real vCPU, IOPS, and network egress into the model to uncover cloud rent markups.', url: ledger/model/ }
    - { title: 'Run an Exit Drill', meta: 'One Afternoon', icon: fa-solid fa-stopwatch, desc: 'Restore your primary database onto a clean machine outside your current cloud and time the result.', url: playbook/exit-drill/ }

faq:
  eyebrow: Direct Answers
  title: Frequently asked questions addressed with candid engineering reality
  items:
    - question: Is this an uncritical anti-cloud campaign?
      answer: >-
        Absolutely not. Public cloud offers unmatched initial speed and elasticity for early-stage teams.
        However, once workloads reach steady state and monthly bills scale into hundreds of thousands of dollars,
        paying compounding premiums for unused elasticity is engineering malpractice. We oppose artificial lock-in, not cloud computing itself.
      open: true
    - question: Should every organization exit the cloud?
      answer: >-
        No. Self-hosting requires baseline systems engineering, automation, and operational discipline.
        Blindly moving to bare metal without the right team can lead to operational headaches.
        Our goal is ensuring every team understands their options: knowing whether they can leave, how long it takes, and what it costs. Staying is only a strategic choice if leaving remains possible.
    - question: How do you ensure datasets and benchmarks remain objective?
      answer: >-
        All pricing snapshots are scraped directly from public vendor documentation, official calculators, and CSV price exports.
        The entire calculation pipeline is open source with verifiable SHA-256 checksums. Outage collections currently contain record templates; publication requires checkable sources and explicit uncertainty.
    - question: Can cloud vendors appeal or correct published information?
      answer: >-
        Yes. The method requires each future assessment to publish its evidence, collection date, and reviewer.
        If a vendor lowers prices, adopts open standards, or identifies factual errors, they can submit evidence through our documented appeal workflow. Changes to published assessments must retain a revision history.
    - question: Does the creator have commercial conflicts of interest?
      answer: >-
        Yes. Initiator Ruohang Feng maintains Pigsty, an open-source PostgreSQL distribution, and provides enterprise support.
        Organizations choosing self-hosted database infrastructure might evaluate or use Pigsty.
        We disclose this relationship and publish sources, assumptions, and calculation methods so readers can challenge the conclusions.

cta:
  title: Next Monday, test your escape hatch once.
  text: Spin up a spare machine, restore your core database backup, time the operation, and catalog every service that breaks. That measured time is your real exit capability.
  label: Start the Exit Drill
  url: playbook/exit-drill/
  style: primary
