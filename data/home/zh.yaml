  - capabilities
  - { type: cards, key: criteria }
  - { type: logo-wall, key: scope }
  - { type: cards, key: actions }
  - faq
  - cta

hero:
  eyebrow: CLOUD EXIT · 开放标准 · 公共实证
  title_lines:
    - 上云是选择，
    - 下云是能力。
  title_size: 4.35rem
  align: center
  lead: >-
    如果系统迁不走、数据导不出、账单算不清，那么“上云”就不是选择，而是套牢。
    用可复现的公开判据、脱水账本与实战演练，重新拿回基础设施的掌控权。
  note: 标准草案 · 带日期的价格快照 · 公开利益披露
  note_icon: fa-solid fa-shield-halved
  actions:
    - { label: 阅读判据标准, url: standard/, icon: fa-solid fa-scale-balanced, style: primary }
    - { label: 查看厂商名录, url: standard/registry/, icon: fa-solid fa-list-check, style: ghost }

capabilities:
  eyebrow: 决策论证链
  title: 评估下云决策，依次回答五个技术现实
  text: 告别空泛立场争吵；从收费套路、真实账本、公开事故到实战演练，步步用事实对账。
  items:
    - ref: 01 / 标准
      title: 识破锁定套路：云厂商到底靠什么卡你？
      url: standard/
      motto: 看实际计费与技术壁垒，不看公关宣传
      bullets:
        - '出网天价流量费（Egress）、私有专有接口、非通用导出格式与长周期折扣锁死。'
        - '5 条可复现判据（C1–C5），覆盖网络通道、全量导出、通用协议、合同解绑与故障赔付。'
        - '全公开测算证据与时间戳，拒绝主观站队，任何工程团队均可对照自查。'
      value: 拿技术事实说话：把公关话术拆解成一条条可以用 cURL 和脚本核验的公开判据。
      visual:
        type: card
        icon: fa-solid fa-scale-balanced
        title: C1–C5 核心判据
        lines: [无退出罚金, 可完整导出, 通用协议接口, 无霸王捆绑, 停机透明问责]

    - ref: 02 / 账本
      title: 等性能算力真账：云上到底加了多少倍溢价？
      url: ledger/
      motto: 算账不是搞玄学，拿 Excel 和行情表就能算清
      bullets:
        - '200 GiB、11.8K IOPS、220 MiB/s 场景下，快照中的 gp3 价格为 AutoPL 的 2.16 倍，详见块存储账本。'
        - '基线物料成本模型在 24 vCPU 与阿里 c8i 按量价相交；利用率、拓扑与购买期限都会改变结论。'
        - '公开价目快照、SQL 测算流水线与原始 CSV 账本全量提供，数字支持任何人复算。'
      value: 每一笔账都看得明明白白：看清云厂商到底在哪些隐蔽计量项上收取高额溢价。
      visual:
        type: code
        title: ledger.snapshot
        lines:
          - { class: c, prefix: '# ', text: '2026-08-22 公开价快照' }
          - { class: p, prefix: 'EBS/ESSD ', text: '基线 0.54× → 等性能 2.16×' }
          - { class: p, prefix: 'S3/OSS   ', text: '¥0.156 / ¥0.120 每 GB 月' }
          - { class: ok, prefix: '✓ ', text: 'SQL脚本 + CSV底表 + SHA-256校验' }

    - ref: 03 / 档案
      title: 实证风险档案：别把鸡蛋全放在别人的篮子里
      url: evidence/
      motto: 集中度风险不是假设，它每隔一段时间就在真实世界上演
      bullets:
        - '事故集合已定义时长、影响、来源与 SLA 救济字段，目前尚未发布正式事故记录。'
        - '专有服务锁定图鉴：梳理从专有数据格式、私有队列到定制 IAM 的典型卡脖子机制。'
        - '公关说辞比对档案：将厂商官方对外宣传与一线工程师实际观测到的事故并排核验。'
      value: 以真实历史为镜：用白纸黑字的公开事故与合同限制，认清所谓五个九高可用的真实边界。
      visual:
        type: components
        items:
          - { icon: fa-solid fa-triangle-exclamation, title: 事故实录, detail: 按时间戳记录 }
          - { icon: fa-solid fa-link, title: 锁定图鉴, detail: 按机制归档 }
          - { icon: fa-solid fa-quote-right, title: 通稿对账, detail: 说法对事实 }
          - { icon: fa-solid fa-clock-rotate-left, title: 证据归档, detail: 历史不可篡改 }

    - ref: 04 / 案例
      title: 脱水下云实录：谁搬成了？谁翻车了？谁又回去了？
      url: cases/
      motto: 不吹嘘神话，也不掩盖踩坑，用工程复盘还原真相
      bullets:
        - '37signals、探探、Ahrefs 是首批校准候选，目前尚未发布完成评估的正式案例。'
        - '部分退出、放弃与回迁将采用与成功案例相同的证据要求。'
        - '统一六维复盘框架：搬了什么、留了什么、花了多少、用时多久、翻车点与再选一次的建议。'
      value: 拒绝幸存者偏差：看清前人的成功因何发生，更看清自己何时适合下云、何时适合留下。
      visual:
        type: card
        icon: fa-solid fa-route
        title: 六维复盘框架
        lines: [搬了什么, 留了什么, 财务花费, 工期跨度, 踩坑翻车点, 如果重来一次]

    - ref: 05 / 手册
      title: 下周一工程演练：一下午测出你的逃生通道
      url: playbook/
      motto: 下云不是盲目跃下悬崖，而是给系统留好带降落伞的安全出口
      bullets:
        - '第一步先别碰业务代码：找一台自建机或备用 VPS，尝试把核心数据全量恢复跑通。'
        - '掐表计时与依赖摸排：记录恢复耗时，并把报错缺少的第三方专有依赖一条条记录在案。'
        - '将逃生演练日常化：把这个恢复指标纳入团队季度容灾演练，成为随时敢离开的底气。'
      value: 从范围有限的恢复演练开始，在可用时间内记录已完成的验证与尚未解决的问题。
      visual:
        type: code
        title: exit-drill.example
        lines:
          - { class: p, prefix: '# ', text: 演练清单示例，非实测记录 }
          - { class: ok, prefix: '1. ', text: 恢复并校验选定的数据集 }
          - { class: ok, prefix: '2. ', text: 记录缺失的依赖 }
          - { class: p, prefix: '3. ', text: 记录实际耗时与剩余工作 }

criteria:
  eyebrow: 五条判据
  title: 一套任何工程师都能自行核验的开放标准
  text: 每条判据均遵循同一工程结构：清晰定义 → 验证命令 → 真实算例 → 边界与反驳。
  columns: 3
  link_label: 查看判据
  items:
    - { title: C1 · 无退出罚金, meta: 经济性, icon: fa-solid fa-arrow-right-from-bracket, desc: 离开时不应承担惩罚性的天价出网流量费或数据导出过桥费。, url: standard/c1-no-exit-toll/ }
    - { title: C2 · 数据可整体导出, meta: 数据, icon: fa-solid fa-box-archive, desc: 团队能在有界时间内导出完整且可用标准格式数据，杜绝专有格式壁垒。, url: standard/c2-whole-data-export/ }
    - { title: C3 · 接口走公开标准, meta: 可移植性, icon: fa-solid fa-plug, desc: 验证所需操作与语义能否通过公开、可独立实现的接口复现。, url: standard/c3-standard-interfaces/ }
    - { title: C4 · 无承诺捆绑, meta: 合同, icon: fa-solid fa-file-signature, desc: 商业折扣不能变成画地为牢的长期捆绑条款，退出路径必须明确。, url: standard/c4-no-commitment-lock/ }
    - { title: C5 · 停机有账可查, meta: 可靠性, icon: fa-solid fa-clock-rotate-left, desc: 服务故障、补救措施与赔付责任应当留下公开透明的可审计记录。, url: standard/c5-accountable-downtime/ }
    - { title: 厂商合规名录, meta: 结果, icon: fa-solid fa-list-check, desc: 目前尚未发布评级。名录定义证据、复核日期、有效期与申诉要求。, url: standard/registry/ }

scope:
  eyebrow: 评价射程
  title: 这条线按技术行为划，不针对任何厂商名字
  text: 卖计算资源是正常的买卖；靠制造人为壁垒收“买路财”，才是需要提防的锁定。
  layout: grid
  columns: 2
  items:
    - title: 射程内
      icon: fa-solid fa-crosshairs
      desc: 惩罚性出网流量费、专有导出壁垒、私有 API 绑定、霸王捆绑条款与不可问责停机。
      url: standard/scope/
    - title: 潜在盟友
      icon: fa-solid fa-handshake
      desc: 坚持标准协议、提供透明带宽定价、支持平滑迁出与多云兼容的计算、IDC 与开放云厂商。
      url: standard/scope/

actions:
  eyebrow: 行动入口
  title: 找一个切入点，先摸清自己的真实处境
  text: 别停留在观望与争论；用最轻量的动作，先验证一个关乎技术主权的关键事实。
  columns: 3
  link_label: 从这里开始
  items:
    - { title: 排查服务锁定, meta: 5 分钟, icon: fa-solid fa-magnifying-glass, desc: 用 C1–C5 五条基线快速比对现有系统，列出被卡住的专有依赖。, url: standard/registry/ }
    - { title: 测算算力真账, meta: 30 分钟, icon: fa-solid fa-calculator, desc: 把业务真实 CPU、存储 IOPS 与带宽代入模型，算算多付了多少溢价。, url: ledger/model/ }
    - { title: 做一次逃生演练, meta: 一个下午, icon: fa-solid fa-stopwatch, desc: 在云外机器完整恢复一次核心数据备份，记录恢复耗时与缺失依赖。, url: playbook/exit-drill/ }

faq:
  eyebrow: 坦诚回答
  title: 关于下云，必须正面讲清楚的几个关键问题
  items:
    - question: 这是一个盲目反云的运动吗？
      answer: >-
        绝不是。公有云在初创期提供了极佳的冷启动速度与按需弹性；但当业务进入成熟期、每月账单达数十万甚至数百万时，
        继续为未使用的弹性付高利贷就是工程失职。我们反对的是人为设立的技术锁定与高昂离场税，不是云本身。
      open: true
    - question: 是不是所有企业都应该下云？
      answer: >-
        不是。下云需要团队具备基础的系统管理与自动化能力；盲目自建可能会导致运维精力不足。
        我们的目标是让每个团队看清自己的选择权：知道能不能走、多久能走、成本几何。只有随时能离开，留在云上才叫真正的战略选择。
    - question: 你们的数据和评级如何保证真实可信？
      answer: >-
        所有价目快照均抓取自云厂商官方公开文档、计算器和 CSV 导出，计算逻辑开源并附带 SHA-256 校验和。
        事故集合目前提供记录模板；正式发布需要可核验来源，并明确标注不确定性。
    - question: 云厂商可以修正或申诉数据吗？
      answer: >-
        完全可以。评测方法要求未来的每项评估公开证据、采集日期与复核人。如果有产品降价、API 开放或事实更正，
        厂商可通过公开流程提交反证，我们核验后将保留变更日志并及时更新。
    - question: 发起人是否存在商业利益冲突？
      answer: >-
        存在。发起人冯若航从事开源 PostgreSQL 发行版 Pigsty 的维护与商业咨询，团队选择自建基础设施时可能会采用相关开源软件或技术服务。
        我们公开披露这一关系，并公布来源、假设与计算方法，供读者检验和反驳。

cta:
  title: 下周一，先把逃生通道测一次。
  text: 找一台备用机恢复核心数据，掐表计时，记下断掉的专有服务。跑通这个流程，下云能力就有了。
  label: 开始下云实操演练
  url: playbook/exit-drill/
  style: primary
